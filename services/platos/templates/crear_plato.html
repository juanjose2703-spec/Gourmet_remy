<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Añadir Plato | REMY 1.0</title>
    
    <link rel="stylesheet" href="estilos/normalize.css">
    <link rel="stylesheet" href="estilos/crear_plato.css">
    <script src="comportamientos/interacciones.js" defer></script>
</head>
<body id="cuerpo_crear_plato">

    <main id="contenedor_crear_plato">
        <header id="cabecera_crear_plato">
            <div class="contenido-header">
                <svg id="btn_menu_movil_form" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor">
                    <path d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16ZM216,184H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"/>
                </svg>
                <h2 id="titulo_vista_form">Añadir Plato</h2>
                <a href="platos_menu.html" id="btn_cerrar_form" title="Cerrar">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor">
                        <path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/>
                    </svg>
                </a>
            </div>
        </header>
<form id="form_anadir_plato" class="contenedor-form">
    <div class="contenedor-columnas-form">
        <section class="bloque-gris">
            <div class="campo-form fila-imagen">
                <label for="input_foto">Subir Imagen</label>
                <div class="box-preview-img">
                    <input type="file" id="input_foto" accept="image/*" onchange="REMY.previewImagen(event)">
                    <img id="img_preview" src="imagenes/ceviche.jpg" alt="Vista previa de la receta">
                </div>
            </div>
            <div class="campo-form">
                <label for="input_nombre">Nombre</label>
                <input type="text" id="input_nombre" class="input-redondeado" placeholder="Ej: Ceviche">
            </div>
            <div class="campo-form fila-textarea">
                <label for="input_descripcion">Descripción</label>
                <textarea id="input_descripcion" class="input-redondeado" rows="3" placeholder="Descripción del platillo..."></textarea>
            </div>
            <div class="campo-form">
                <label for="input_categoria">Categoría</label>
                <input type="text" id="input_categoria" class="input-redondeado input-select" readonly onclick="REMY.abrirModal('modal_categoria')" placeholder="Seleccionar...">
            </div>
        </section>
        <div class="columna-ingredientes">
            
            <section class="bloque-gris">
                <div id="contenedor_ingredientes">
                    <div class="campo-form item-ingrediente">
                        <label>Ingrediente 1</label>
                        <input type="text" class="input-redondeado input-ingrediente" readonly placeholder="Seleccionar..." onclick="REMY.abrirModal('modal_ingredientes')">
                    </div>
                    <div class="campo-form item-ingrediente">
                        <label>Ingrediente 2</label>
                        <input type="text" class="input-redondeado input-ingrediente" readonly placeholder="Seleccionar..." onclick="REMY.abrirModal('modal_ingredientes')">
                    </div>
                </div>
            </section>
            <div class="controles-ingredientes">
                <span class="label-ingredientes">Ingredientes</span>
                <div class="botones-mas-menos">
                    <button type="button" class="btn-ctrl fondo-verde" onclick="REMY.removerIngrediente()" aria-label="Quitar ingrediente">-</button>
                    <button type="button" class="btn-ctrl fondo-verde" onclick="REMY.agregarIngrediente()" aria-label="Agregar ingrediente">+</button>
                </div>
            </div>
        </div>
    </div>
    <button type="submit" class="btn-submit fondo-verde letra-blanca">Añadir Plato</button>
</form>
        <dialog id="modal_categoria" class="modal-overlay">
            <div class="modal-contenido">
                <h3>Selecciona una Categoría</h3>
                <ul class="lista-opciones-modal">
                    <li onclick="REMY.seleccionarCategoria('Plato Fuerte')">Plato Fuerte</li>
                    <li onclick="REMY.seleccionarCategoria('Entrada')">Entrada</li>
                    <li onclick="REMY.seleccionarCategoria('Postre')">Postre</li>
                    <li onclick="REMY.seleccionarCategoria('Bebida')">Bebida</li>
                </ul>
                <button type="button" class="btn-cerrar-modal" onclick="REMY.cerrarModal('modal_categoria')">Cancelar</button>
            </div>
        </dialog>
        <dialog id="modal_ingredientes" class="modal-overlay">
            <div class="modal-contenido">
                <h3>Buscador de Ingredientes</h3>
                <p class="texto-modal-vacio">Aún no hay ingredientes registrados para seleccionar.</p>
                <button type="button" class="btn-cerrar-modal" onclick="REMY.cerrarModal('modal_ingredientes')">Cerrar</button>
            </div>
        </dialog>

    </main>

</body>
</html>
