<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Menú | REMY 1.0</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/normalize.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/detalle_menu.css') }}">
</head>
<body>
    <div id="gran_padre_cont">
        <header id="cabezote_seccion_ppal">
            <svg id="btn_menu_movil" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor">
                <path d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16ZM216,184H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"/>
            </svg>
            <h2 id="titulo_vista_ppal">Detalle de menú</h2>
            <a href="/platos_menu" id="btn_cerrar_vista" title="Cerrar">✕</a>
        </header>

        <main id="cuerpo_ppal_cont">
            <section id="sec_detalle_platillo" class="cont-detalle-grid">
                
                <!-- Carrusel de Imágenes -->
                <article id="cont_carrusel_ppal">
                    <div class="cont-marcador-gris">
                        <div class="cont-visor-img">
                            <div id="tira_imagenes" class="tira-diapositivas"></div>
                        </div>
                    </div>
                    <nav id="cont_puntos_carrusel" class="cont-indicadores"></nav>
                </article>

                <!-- Información del Menú -->
                <article id="cont_info_ppal">
                    <header class="encabezado-platillo">
                        <h3 class="tit-platillo">Cargando...</h3>
                        <span class="precio-platillo">$0</span>
                    </header>

                    <div class="cont-descripcion-txt">
                        <p class="txt-descripcion"></p>
                    </div>

                    <footer class="pie-info-meta">
                        <div class="col-meta-datos">
                            <p class="txt-meta">Fecha creación: <strong>-</strong></p>
                            <p class="txt-meta">Tiempos: <strong>-</strong></p>
                        </div>

                        <div class="col-meta-swtch">
                            <span id="lbl_estado_swtch" class="txt-estado">Activo</span>
                            <label class="swtch-capsula" for="swtch_estado_plato">
                                <input type="checkbox" id="swtch_estado_plato" checked>
                                <span class="deslizador-swtch"></span>
                            </label>
                        </div>
                    </footer>
                </article>

            </section>

            <!-- Botón flotante -->
            <a href="#" id="btn_flotante_editar" class="btn-agregar-flotante fondo-verde letra-blanca" title="Editar menú">
                <svg viewBox="0 0 256 256" fill="currentColor">
                    <path d="M227.31,73.37,182.63,28.69a16,16,0,0,0-22.63,0L36.69,152A15.86,15.86,0,0,0,32,163.31V208a16,16,0,0,0,16,16H92.69A15.86,15.86,0,0,0,104,219.31L227.31,96A16,16,0,0,0,227.31,73.37ZM92.69,208H48V163.31l88-88L180.69,120ZM192,108.69,147.31,64l24-24L216,84.69Z"/>
                </svg>
            </a>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/detalle_menu.js') }}" defer></script>
</body>
</html>
