<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda | REMY 1.0</title>
    
    <link rel="stylesheet" href="../static/css/normalize.css">
    <link rel="stylesheet" href="../static/css/busqueda.css">
        <!-- Vinculación del JavaScript -->
    <script src="../static/js/busqueda_remy.js" defer></script>
</head>
<body>

    <div id="gran_padre_cont">
        
        <!-- CABEZOTE SUPERIOR -->
        <header id="cabezote_seccion_ppal">
            <svg id="btn_menu_movil" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor">
                <path d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16ZM216,184H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"/>
            </svg>
            <h2 id="titulo_vista_ppal">Búsqueda</h2>
            <a href="platos_menu.html" id="btn_cerrar_vista" title="Cerrar">✕</a>
        </header>

        <!-- CONTENIDO PRINCIPAL -->
        <main id="cuerpo_ppal_cont">
            
                        <!-- BARRA DE BÚSQUEDA Y FILTRO -->
            <section id="sec_barra_busqueda">
                <div class="caja-campo-busqueda">
                    <input type="text" id="input_busqueda" class="input-texto-busqueda" placeholder="Buscar por título, categoría o ingrediente..." value="" autocomplete="off">
                    
                    <div class="cont-iconos-busqueda">
                        <button type="button" class="btn-icono-accion" id="btn_ejecutar_busqueda" title="Buscar">
                            <svg class="ico-accion-svg" viewBox="0 0 256 256" fill="currentColor">
                                <path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"/>
                            </svg>
                        </button>
                        
                        <span class="separador-iconos"></span>

                        <button type="button" class="btn-icono-accion" id="btn_abrir_filtro" title="Filtrar">
                            <svg class="ico-accion-svg" viewBox="0 0 256 256" fill="currentColor">
                                <path d="M230.6,49.53A15.81,15.81,0,0,0,216,40H40A16,16,0,0,0,28.19,66.76l.08.09L96,139.17V216a16,16,0,0,0,24.87,13.32l32-21.33A16,16,0,0,0,160,194.67V139.17l67.73-72.32.08-.09A15.8,15.8,0,0,0,230.6,49.53Z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                    <!-- Panel de filtro por tipo -->
                <div id="panel_filtro" class="oculto">
                    <button type="button" class="btn-filtro-tipo activo" data-tipo="todos">Todos</button>
                    <button type="button" class="btn-filtro-tipo" data-tipo="Plato">Platos</button>
                    <button type="button" class="btn-filtro-tipo" data-tipo="Menú">Menús</button>
                    <button type="button" class="btn-filtro-tipo" data-tipo="Ingrediente">Ingredientes</button>
                </div>
            </section>

                <!-- GRILLA DE RESULTADOS DE BÚSQUEDA -->
            <section id="sec_lista_resultados" class="lista-tarjetas-grid">
            </section>

                <!-- MENSAJE SI NO HAY RESULTADOS -->
            <div id="sin_resultados_msj" class="oculto">
                <p>No se encontraron coincidencias con tu búsqueda.</p>
            </div>

        </main>

    </div>
</body>
</html>
